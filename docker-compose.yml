version: "3.9"

services:
  # -----------------------
  # PostgreSQL Database
  # -----------------------
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # -----------------------
  # Go Backend (Gin)
  # -----------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: go_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      PORT: 8092
    ports:
      - "8092:8092"
    networks:
      - app_network

  # -----------------------
  # React Frontend
  # -----------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    restart: always
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"   # Enables hot reload inside Docker
      REACT_APP_API_URL: http://localhost:8092
    ports:
      - "3000:3000"
    networks:
      - app_network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "start"]

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
